<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOTHING</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="background"></div>
    <div class="background-overlay"></div>
    <div class="container">
        <div class="text-section">
            <h1>Hey, I'm <span>NOTHING</span></h1>
            <p class="permanent-message">...yet in nothing, there is everything.</p>
            <div class="timestamp"><span id="current-time"></span></div>
            <div class="music-player">
                <audio id="background-music" loop>
                    <source src="music.mp3" type="audio/mp3">
                    Your browser does not support the audio element.
                </audio>
            </div>
        </div>
        <div class="image-section">
            <div class="image-wrapper" id="image-control" role="button" tabindex="0" aria-label="Toggle music playback">
                <img id="profile-image" src="./images/profile.jpg" alt="Person looking down a road">
                <div class="image-overlay">
                    <div class="overlay-icon">
                        <i id="image-overlay-icon" class="fas fa-play" aria-hidden="true"></i>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <footer class="search-bar">
        <form id="search-form">
            <label for="search-question">If you have a question,</label>
            <input type="text" id="search-question" placeholder="ask Google...">
            <button type="submit">Search</button>
        </form>
    </footer>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.clouds.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
