<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOTHING</title>
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- Link to your external CSS file -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Top navigation bar -->
    <nav class="top-nav">
        <div class="logo">N</div>
        <!-- Replaced nav links with GitHub icon -->
        <div class="nav-links">
            <a href="https://github.com/nothingxz0/" target="_blank" class="github-link">
                <i class="fab fa-github"></i>
            </a>
        </div>
        <div class="search-container">
            <form id="search-form">
                <input type="text" id="search-question" placeholder="Ask Google...">
                <button type="submit"><i class="fas fa-search"></i></button>
            </form>
        </div>
    </nav>

    <!-- Side text elements -->
    <div class="side-text left">Nothing / Empty</div>
    <div class="side-text right">2023</div>

    <!-- Main content area -->
    <main class="container">
        <div class="content-section">
            <div class="stats">
                <div class="stat">
                    <h3>9</h3>
                    <p>Projects completed</p>
                </div>
                <div class="stat">
                    <h3>42</h3>
                    <p>Words spoken</p>
                </div>
            </div>
            
            <!-- Restored original headline format -->
            <div class="headline">
                <h1>Hey, I'm <span><br>NOTHING</span></h1>
                <p class="subtitle">— yet in nothing, there is everything</p>
            </div>
            
            <div class="music-player">
                <audio id="background-music" loop>
                    <source src="music.mp3" type="audio/mp3">
                    Your browser does not support the audio element.
                </audio>
                <button id="play-pause" class="music-control"><i class="fas fa-play"></i></button>
                <div class="progress-container">
                    <div id="audio-progress" class="audio-progress"></div>
                </div>
                <div class="timestamp"><span id="current-time"></span></div>
            </div>
            
            <!--<div class="scroll-indicator">
                <p>Scroll down</p>
                <i class="fas fa-arrow-down"></i>
            </div>-->
        </div>
        
        <!-- Image section updated to use the new image -->
        <div class="image-section">
            <img id="profile-image" src="./images/goku1.png" alt="A powerful character portrait">
        </div>
    </main>

    <div class="fog-container">
        <div id="foglayer_01" class="fog"><div class="image01"></div><div class="image02"></div></div>
        <div id="foglayer_02" class="fog"><div class="image01"></div><div class="image02"></div></div>
        <div id="foglayer_03" class="fog"><div class="image01"></div><div class="image02"></div></div>
    </div>

    <!-- Link to your external JS file -->
    <script src="script.js"></script>
</body>
</html>
